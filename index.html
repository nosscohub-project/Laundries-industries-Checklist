<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAESHEN LAUNDRY FACILITY — INITIAL SITE VISIT Checklist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 30px;;
            text-align: center;
        }
        
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }
        
        .content {
            padding: 30px;
        }
        
        .checklist {
            list-style: none;
        }
        
        .checklist li {
            padding: 16px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: all 0.2s ease;
            border-left: 4px solid #667eea;
        }
        
        .checklist li:hover {
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transform: translateX(4px);
        }
        
        .checklist input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-right: 16px;
            accent-color: #667eea;
            transition: transform 0.2s ease;
        }
        
        .checklist label {
            cursor: pointer;
            font-size: 0.95rem;
            color: #444;
            user-select: none;
        }
        
        .checklist input[type="checkbox"]:checked + label {
            color: #28a745;
            text-decoration: line-through;
        }
        
        .checklist input[type="checkbox"]:checked {
            transform: scale(1.1);
        }
        
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a1a2e;
            margin: 24px 0 12px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #e9ecef;
        }
        
        .summary {
            margin-top: 30px;
            padding: 20px;
            background: #e3f2fd;
            border-radius: 8px;
            text-align: center;
        }
        
        .summary h3 {
            color: #1976d2;
            margin-bottom: 8px;
        }
        
        .summary p {
            color: #666;
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.4rem;
            }
            
            .content {
                padding: 20px;
            }
            
            .header {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>BAESHEN LAUNDRY FACILITY — INITIAL SITE VISIT</h1>
            <p>Site Assessment Checklist</p>
        </div>
        
        <div class="content">
            <ul class="checklist">
                <li>
                    <input type="checkbox" id="item1">
                    <label for="item1">Obtain the client's site master plan and identify the exact proposed laundry plot or building.</label>
                </li>
                <li>
                    <input type="checkbox" id="item2">
                    <label for="item2">Measure the available area and record photographs of the proposed location.</label>
                </li>
                <li>
                    <input type="checkbox" id="item3">
                    <label for="item3">Confirm whether the existing water supply can support industrial washing.</label>
                </li>
                <li>
                    <input type="checkbox" id="item4">
                    <label for="item4">Inspect the nearest drainage connection and obtain discharge capacity and acceptance information.</label>
                </li>
                <li>
                    <input type="checkbox" id="item5">
                    <label for="item5">Request electrical load information and check heating and dryer-exhaust options.</label>
                </li>
                <li>
                    <input type="checkbox" id="item6">
                    <label for="item6">Confirm separation from food production and the client's hygiene requirements, if applicable.</label>
                </li>
                <li>
                    <input type="checkbox" id="item7">
                    <label for="item7">Collect expected laundry volume, required processing type and preliminary budget.</label>
                </li>
            </ul>
            
            <div class="summary">
                <h3>Checklist Progress</h3>
                <p>Track completed items by checking the boxes above. Use this checklist to ensure all site visit requirements are met.</p>
            </div>
        </div>
    </div>
    
    <script>
        // Save checkbox state to localStorage
        document.querySelectorAll('.checklist input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                localStorage.setItem(`checklist-item-${this.id}`, this.checked);
            });
            
            // Load saved state
            const saved = localStorage.getItem(`checklist-item-${this.id}`);
            if (saved === 'true') {
                this.checked = true;
                this.nextElementSibling.style.color = '#28a745';
                this.nextElementSibling.style.textDecoration = 'line-through';
            }
        });
    </script>
</body>
</html>
